# Continuous integration: the quick tier on every push and pull request (Node 20 and 22), the local
# tier on every push and pull request, the MOS cases inside a real MosAIc (`e2e-mosaic`) on every
# push and pull request, the installer's tests on macOS and Windows on every push to master, and
# every pool in full, with the conformance runner and the quirk suite (`quirks-mosaic`, which waits
# a minute for QRK-1), on every push to master and by hand. MosAIc is built once per pinned commit
# and cached under the hash of `rigs/e2e/mosaic-pin.json`. Every job installs with `npm ci` and caches npm's cache under the key of
# package-lock.json.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:quick

  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:local

  installer-os:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run packages/installer
        env:
          DISTILLER_TIER: local

  pools-full:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:full
      - run: npm run conformance

  e2e-mosaic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: rigs/e2e/.mosaic
          key: mosaic-${{ hashFiles('rigs/e2e/mosaic-pin.json') }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run --auto-servernum npm run test:e2e

  quirks-mosaic:
    if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: rigs/e2e/.mosaic
          key: mosaic-${{ hashFiles('rigs/e2e/mosaic-pin.json') }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run --auto-servernum npm run test:quirks
